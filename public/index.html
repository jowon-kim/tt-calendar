<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FBF3F4">
<link rel="manifest" href="/manifest.json">
<!-- 홈 화면에 추가하면 앱처럼 뜹니다. 아이폰은 이 상태여야 알림을 켤 수 있어요. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>TT</title>
<meta name="description" content="TT is a free shared calendar for couples: plans, anniversaries and day counts, with a notification when your partner changes something. Works in the browser, no app store needed.">
<link rel="canonical" href="https://tt-calendar.vercel.app/">
<link rel="alternate" hreflang="en" href="https://tt-calendar.vercel.app/en/">
<link rel="alternate" hreflang="ko" href="https://tt-calendar.vercel.app/ko/">
<link rel="alternate" hreflang="ja" href="https://tt-calendar.vercel.app/ja/">
<link rel="alternate" hreflang="zh-CN" href="https://tt-calendar.vercel.app/zh-CN/">
<link rel="alternate" hreflang="es" href="https://tt-calendar.vercel.app/es/">
<link rel="alternate" hreflang="fr" href="https://tt-calendar.vercel.app/fr/">
<link rel="alternate" hreflang="de" href="https://tt-calendar.vercel.app/de/">
<link rel="alternate" hreflang="pt-BR" href="https://tt-calendar.vercel.app/pt-BR/">
<link rel="alternate" hreflang="ru" href="https://tt-calendar.vercel.app/ru/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TT">
<meta property="og:title" content="TT — a free shared calendar for couples">
<meta property="og:description" content="Plans, anniversaries and day counts for the two of you, with a notification when your partner changes something.">
<meta property="og:url" content="https://tt-calendar.vercel.app/">
<meta property="og:image" content="https://tt-calendar.vercel.app/landing/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face {
  font-family: 'Ownglyph_ParkDaHyun';
  src: url('/fonts/Ownglyph_ParkDaHyun.woff2') format('woff2');
  font-weight: normal; font-display: swap;
}
</style>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

<!-- 1초 인트로 -->
<section id="intro" class="gate intro" hidden data-i18n-attr="aria-label:intro.label">
  <div class="gate-inner intro-inner">
    <div class="mascot-hero">
      <img src="/mascot.png" alt="" width="168" height="168">
    </div>
    <h1 class="gate-title app-name">TT</h1>
    <p class="gate-sub app-sub">what are we up to today</p>
  </div>
</section>

<!-- 로그인 -->
<section id="gate" class="gate" hidden>
  <div class="gate-inner">
    <div class="mascot-hero">
      <img src="/mascot.png" alt="" width="168" height="168">
    </div>
    <h1 class="gate-title app-name">TT</h1>
    <p class="gate-sub app-sub">what are we up to today</p>
    <p id="gate-note" class="gate-note" hidden></p>
    <!-- 구글 하나로 들어옵니다 (2026-10-23). 처음이면 그 자리에서 가입돼요. 버튼은 구글이 그려줍니다 -->
    <div id="gate-google" class="gate-google" hidden>
      <div id="gate-google-button" class="google-button"></div>
    </div>
    <p id="gate-error" class="gate-error" role="alert"></p>
    <div class="gate-links">
      <a href="/en/" id="gate-about" class="gate-link" data-i18n="gate.about"></a>
      <a href="/privacy.html" class="gate-link" target="_blank" rel="noopener" data-i18n="settings.privacy"></a>
    </div>
  </div>
</section>

<!-- 본 화면 -->
<main id="app" class="app" hidden>
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <path class="mark-stem" d="M20 7 C15 13 12 18 11.5 23"/>
        <path class="mark-stem" d="M20 7 C25 13 28 18 28.5 23"/>
        <path class="mark-leaf" d="M20 8 C24 4 29 4.5 30 6 C29.5 9.5 24 11 20 8Z"/>
        <circle class="mark-fruit a" cx="11.5" cy="27" r="5"/>
        <circle class="mark-fruit b" cx="28.5" cy="27" r="5"/>
        <circle class="mark-shine" cx="10" cy="25.5" r="1.4"/>
        <circle class="mark-shine" cx="27" cy="25.5" r="1.4"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name app-name">TT</span>
        <span id="dday" class="dday" hidden></span>
      </div>
    </div>
    <button id="open-settings" class="icon-btn" type="button" data-i18n-attr="aria-label:settings.title">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4"/><path d="M19.6 14.6a1.6 1.6 0 0 0 .32 1.76l.06.06a1.9 1.9 0 1 1-2.7 2.7l-.05-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.46v.17a1.9 1.9 0 1 1-3.8 0v-.09a1.6 1.6 0 0 0-1.05-1.46 1.6 1.6 0 0 0-1.76.32l-.06.06a1.9 1.9 0 1 1-2.7-2.7l.06-.06a1.6 1.6 0 0 0 .32-1.76 1.6 1.6 0 0 0-1.46-.98h-.17a1.9 1.9 0 0 1 0-3.8h.09a1.6 1.6 0 0 0 1.46-1.05 1.6 1.6 0 0 0-.32-1.76l-.06-.06a1.9 1.9 0 1 1 2.7-2.7l.06.06a1.6 1.6 0 0 0 1.76.32h.08A1.6 1.6 0 0 0 10.6 3.4v-.17a1.9 1.9 0 1 1 3.8 0v.09a1.6 1.6 0 0 0 .97 1.46 1.6 1.6 0 0 0 1.77-.32l.05-.06a1.9 1.9 0 1 1 2.7 2.7l-.06.06a1.6 1.6 0 0 0-.32 1.76v.08a1.6 1.6 0 0 0 1.46.97h.17a1.9 1.9 0 1 1 0 3.8h-.09a1.6 1.6 0 0 0-1.46.97z"/></svg>
    </button>
  </header>

  <nav class="monthbar">
    <button id="prev-month" class="icon-btn" type="button" data-i18n-attr="aria-label:app.prevMonth">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2 id="month-label" class="month-label" aria-live="polite"></h2>
    <button id="next-month" class="icon-btn" type="button" data-i18n-attr="aria-label:app.nextMonth">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button id="today-btn" class="pill" type="button" data-i18n="app.today"></button>
  </nav>

  <div class="calendar">
    <div class="weekdays" aria-hidden="true">
      <span class="sun" data-week="0"></span><span data-week="1"></span><span data-week="2"></span><span data-week="3"></span><span data-week="4"></span><span data-week="5"></span><span class="sat" data-week="6"></span>
    </div>
    <div id="grid-wrap" class="grid-wrap">
      <div id="grid-track" class="grid-track">
        <div id="grid-prev" class="grid grid-peek" aria-hidden="true" inert></div>
        <div id="grid" class="grid"></div>
        <div id="grid-next" class="grid grid-peek" aria-hidden="true" inert></div>
      </div>
    </div>
  </div>

  <section class="upcoming">
    <h3 class="section-title" data-i18n="app.upcoming"></h3>
    <ul id="upcoming-list" class="upcoming-list"></ul>
  </section>

  <button id="add-btn" class="fab" type="button" data-i18n-attr="aria-label:app.addEvent">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</main>

<!-- 하루 보기 -->
<div id="sheet-backdrop" class="backdrop" hidden></div>
<section id="sheet" class="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-date">
  <div class="sheet-handle" aria-hidden="true"></div>
  <header class="sheet-head">
    <div>
      <h2 id="sheet-date" class="sheet-date"></h2>
      <p id="sheet-note" class="sheet-note"></p>
    </div>
    <button id="sheet-close" class="icon-btn" type="button" data-i18n-attr="aria-label:common.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <ul id="sheet-list" class="day-list"></ul>
  <button id="sheet-add" class="btn btn-ghost full sheet-add" type="button" data-i18n="sheet.add"></button>
</section>

<!-- 일정 쓰기 -->
<dialog id="editor" class="dialog">
  <form id="editor-form" method="dialog" novalidate>
    <header class="dialog-head">
      <h2 id="editor-title" class="dialog-title" data-i18n="editor.new"></h2>
      <button type="button" id="editor-close" class="icon-btn" data-i18n-attr="aria-label:common.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <label class="field">
      <span class="label" data-i18n="editor.what"></span>
      <input id="f-title" type="text" maxlength="80" data-i18n-attr="placeholder:editor.whatHint">
    </label>

    <div class="field">
      <span class="label" data-i18n="editor.whose"></span>
      <div id="f-owner" class="owner-picker" role="radiogroup" data-i18n-attr="aria-label:editor.whose"></div>
    </div>

    <div class="field">
      <span class="label" data-i18n="editor.color"></span>
      <div id="f-color" class="color-picker" role="radiogroup" data-i18n-attr="aria-label:editor.color"></div>
    </div>

    <div class="field">
      <span class="label" data-i18n="editor.date"></span>
      <button type="button" class="date-btn" data-date-for="f-date" id="f-date-btn">
        <span class="date-ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5"/></svg></span>
        <span class="date-text" id="f-date-text" data-i18n="common.pickDate"></span>
      </button>
      <input id="f-date" type="hidden">
    </div>

    <!-- 커스텀 시간 -->
    <div class="time-field" id="f-time-wrap">
      <span class="label" data-i18n="editor.time"></span>
      <div id="time-toggle" class="time-toggle" role="button" tabindex="0" aria-expanded="false">
        <span class="clock"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg></span>
        <span id="time-text" class="time-text placeholder" data-i18n="editor.allDay"></span>
        <button type="button" id="time-clear" class="time-clear" data-i18n-attr="aria-label:editor.clearTime" hidden>
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="time-panel" class="time-panel" hidden>
        <div id="time-mode" class="time-mode-seg" role="radiogroup" data-i18n-attr="aria-label:editor.timeMode">
          <button type="button" class="time-mode-opt" data-mode="point" aria-checked="true" data-i18n="editor.atTime"></button>
          <button type="button" class="time-mode-opt" data-mode="range" aria-checked="false" data-i18n="editor.timeRange"></button>
        </div>
        <div id="time-group-start" class="time-group">
          <p id="time-start-label" class="time-group-label" data-i18n="editor.startsAt" hidden></p>
          <div id="ampm" class="ampm">
            <button type="button" data-ampm="am" data-i18n="editor.am"></button>
            <button type="button" data-ampm="pm" data-i18n="editor.pm"></button>
          </div>
          <div class="time-reels">
            <div id="reel-hour" class="reel" data-i18n-attr="aria-label:editor.hour"></div>
            <span class="reel-colon">:</span>
            <div id="reel-min" class="reel" data-i18n-attr="aria-label:editor.minute"></div>
          </div>
        </div>
        <div id="time-group-end" class="time-group" hidden>
          <p class="time-group-label" data-i18n="editor.endsAt"></p>
          <div id="ampm-end" class="ampm">
            <button type="button" data-ampm="am" data-i18n="editor.am"></button>
            <button type="button" data-ampm="pm" data-i18n="editor.pm"></button>
          </div>
          <div class="time-reels">
            <div id="reel-hour-end" class="reel" data-i18n-attr="aria-label:editor.hour"></div>
            <span class="reel-colon">:</span>
            <div id="reel-min-end" class="reel" data-i18n-attr="aria-label:editor.minute"></div>
          </div>
        </div>
        <div id="time-chips" class="time-chips">
          <button type="button" class="time-chip" data-time="09:00" data-i18n="editor.chipMorning"></button>
          <button type="button" class="time-chip" data-time="12:00" data-i18n="editor.chipNoon"></button>
          <button type="button" class="time-chip" data-time="18:30" data-i18n="editor.chipEvening"></button>
          <button type="button" class="time-chip" data-time="20:00" data-i18n="editor.chipNight"></button>
        </div>
      </div>
    </div>

    <div class="check-row">
      <label class="check">
        <input id="f-multi" type="checkbox">
        <span data-i18n="editor.multiDay"></span>
      </label>
      <label class="check">
        <input id="f-repeat-on" type="checkbox">
        <span data-i18n="editor.repeats"></span>
      </label>
    </div>
    <div class="field" id="f-end-wrap" hidden>
      <span class="label" data-i18n="editor.endDate"></span>
      <button type="button" class="date-btn" data-date-for="f-end" id="f-end-btn">
        <span class="date-ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5"/></svg></span>
        <span class="date-text" id="f-end-text" data-i18n="common.pickDate"></span>
      </button>
      <input id="f-end" type="hidden">
      <p class="note" data-i18n="editor.multiDayNote"></p>
    </div>

    <div class="field" id="f-repeat-wrap" hidden>
      <span class="label" data-i18n="editor.howOften"></span>
      <div id="f-repeat" class="repeat-seg" role="radiogroup" data-i18n-attr="aria-label:editor.repeats">
        <button type="button" class="repeat-opt" data-repeat="monthly" aria-checked="true" data-i18n="editor.monthly"></button>
        <button type="button" class="repeat-opt" data-repeat="yearly" aria-checked="false" data-i18n="editor.yearly"></button>
      </div>
      <p class="note" id="f-repeat-summary" hidden></p>
      <p class="note" id="f-repeat-note" hidden></p>
    </div>

    <label class="field">
      <span class="label" data-i18n="editor.memo"></span>
      <textarea id="f-memo" rows="2" maxlength="1000" data-i18n-attr="placeholder:editor.memoHint"></textarea>
    </label>

    <p id="editor-error" class="form-error" role="alert"></p>

    <footer class="dialog-foot">
      <button type="button" id="f-delete" class="btn btn-danger" data-i18n="common.delete" hidden></button>
      <div class="spacer"></div>
      <button type="button" id="f-cancel" class="btn btn-ghost" data-i18n="common.cancel"></button>
      <button type="submit" id="f-save" class="btn btn-solid" data-i18n="common.save"></button>
    </footer>
  </form>
</dialog>

<!-- 설정 -->
<dialog id="settings" class="dialog">
  <div class="dialog-body">
    <header class="dialog-head">
      <h2 class="dialog-title" data-i18n="settings.title"></h2>
      <div class="head-tools">
        <button type="button" id="guide-open" class="icon-btn" data-i18n-attr="aria-label:guide.title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.3v.4"/><path d="M12 17h.01"/></svg>
        </button>
        <button type="button" id="settings-close" class="icon-btn" data-i18n-attr="aria-label:common.close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <div class="tabs" role="tablist">
      <button type="button" class="tab" id="s-tab-basic" role="tab" aria-controls="s-pane-basic" data-i18n="settings.tabBasic"></button>
      <button type="button" class="tab" id="s-tab-design" role="tab" aria-controls="s-pane-design" data-i18n="settings.tabDesign"></button>
    </div>

    <div id="s-pane-basic" role="tabpanel">
    <p class="note pane-lead" data-i18n-html="settings.autosave"></p>

    <label class="field">
      <span class="label" data-i18n="settings.language"></span>
      <select id="s-locale"></select>
    </label>

    <label class="field">
      <span class="label" data-i18n="settings.holidays"></span>
      <select id="s-region"></select>
      <p class="note" data-i18n="settings.holidaysNote"></p>
    </label>

    <label class="field">
      <span class="label" data-i18n="settings.timezone"></span>
      <select id="s-timezone"></select>
      <p class="note" data-i18n="settings.timezoneNote"></p>
    </label>

    <label class="field">
      <span class="label" data-i18n="settings.appName"></span>
      <input id="s-title" type="text" maxlength="12" data-i18n-attr="placeholder:default.title">
      <p class="note" data-i18n="settings.appNameNote"></p>
    </label>

    <label class="field">
      <span class="label" data-i18n="settings.greeting"></span>
      <input id="s-subtitle" type="text" maxlength="20" data-i18n-attr="placeholder:default.subtitle">
      <p class="note" data-i18n="settings.greetingNote"></p>
    </label>

    <div class="field">
      <span class="label" data-i18n="settings.people"></span>
      <div id="s-people" class="people">
        <div class="person" data-owner="a">
          <span class="person-bud"></span>
          <input id="s-name-a" type="text" maxlength="12" data-i18n-attr="aria-label:settings.nameA">
          <span class="person-me" data-i18n="settings.thisIsMe"></span>
        </div>
        <div class="person" data-owner="b">
          <span class="person-bud"></span>
          <input id="s-name-b" type="text" maxlength="12" data-i18n-attr="aria-label:settings.nameB">
          <span class="person-me" data-i18n="settings.thisIsMe"></span>
        </div>
      </div>
      <p class="note people-note" data-i18n-html="settings.peopleNote"></p>
    </div>

    <!-- 상대가 아직 안 들어왔을 때만 보입니다 -->
    <div class="field" id="s-invite-field" hidden>
      <span class="label" data-i18n="settings.invite"></span>
      <button type="button" id="s-invite" class="btn btn-solid btn-wide" data-i18n="settings.inviteMake"></button>
      <input id="s-invite-link" type="text" readonly spellcheck="false" autocomplete="off" hidden>
      <p class="note" data-i18n="settings.inviteNote"></p>
    </div>

    <div class="field">
      <span class="label" data-i18n="settings.since"></span>
      <button type="button" class="date-btn" data-date-for="s-since" id="s-since-btn">
        <span class="date-ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5"/></svg></span>
        <span class="date-text" id="s-since-text" data-i18n="common.pickDate"></span>
      </button>
      <input id="s-since" type="hidden">
    </div>

    <label class="check">
      <input id="s-milestones" type="checkbox">
      <span data-i18n="settings.milestones"></span>
    </label>


    <div class="field">
      <span class="label" data-i18n="settings.push"></span>
      <button type="button" id="s-push" class="btn btn-ghost btn-wide"></button>
      <p class="note" id="s-push-note"></p>
    </div>

    <div class="field" id="s-install-field" hidden>
      <span class="label" data-i18n="settings.install"></span>
      <button type="button" id="s-install" class="btn btn-ghost btn-wide" data-i18n="install.button"></button>
      <p class="note" data-i18n="install.note"></p>
    </div>

    <div class="field">
      <span class="label" data-i18n="settings.account"></span>
      <div class="account-actions">
        <button type="button" id="s-password" class="btn btn-ghost" data-i18n="settings.changePassword"></button>
        <button type="button" id="s-delete" class="btn btn-danger" data-i18n="settings.deleteAccount"></button>
      </div>
      <div id="s-devices-box" hidden>
        <span class="label" data-i18n="settings.devices"></span>
        <ul id="s-devices" class="devices"></ul>
      </div>
      <p class="note"><a href="/privacy.html" target="_blank" rel="noopener" data-i18n="settings.privacy"></a></p>
    </div>

    </div>

    <div id="s-pane-design" role="tabpanel" hidden>
    <div class="field">
      <span class="label" data-i18n="settings.theme"></span>
      <div id="s-theme" class="theme-picker" role="radiogroup" data-i18n-attr="aria-label:settings.theme"></div>
      <label class="check">
        <input id="s-theme-share" type="checkbox" checked>
        <span data-i18n="settings.themeShare"></span>
      </label>
      <p class="note" id="s-theme-note"></p>
    </div>

    <div class="field">
      <span class="label" data-i18n="settings.photos"></span>
      <button type="button" id="s-photos-open" class="btn btn-ghost btn-wide" data-i18n="settings.photosOpen"></button>
      <p class="note" id="s-photos-note"></p>
    </div>
    </div>

    <footer class="dialog-foot">
      <p class="note account-login" id="s-account"></p>
      <button type="button" id="s-logout" class="btn btn-ghost" data-i18n="settings.logout"></button>
    </footer>
  </div>
</dialog>

<!-- 달력 사진 (설정 위에 겹쳐 뜸) -->
<dialog id="photos" class="dialog">
  <div class="dialog-body">
    <header class="dialog-head">
      <h2 class="dialog-title" data-i18n="settings.photos"></h2>
      <button type="button" id="photos-close" class="icon-btn" data-i18n-attr="aria-label:common.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div id="s-photos" class="photo-grid"></div>
    <p class="note" id="s-photos-count"></p>
    <input id="s-photo-file" type="file" accept="image/*" multiple hidden>

    <footer class="dialog-foot">
      <div class="spacer"></div>
      <button type="button" id="s-photo-add" class="btn btn-solid" data-i18n="photos.add"></button>
    </footer>
  </div>
</dialog>

<!-- 커스텀 날짜 고르기 (dialog라 다른 팝업 위에 뜸) -->
<dialog id="datepick" class="datepick-dialog">
  <div class="datepick">
    <div class="datepick-head">
      <button type="button" id="dp-prev" class="icon-btn" data-i18n-attr="aria-label:app.prevMonth">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button type="button" id="dp-title" class="dp-title" data-i18n-attr="aria-label:datepick.changeMonth"></button>
      <button type="button" id="dp-next" class="icon-btn" data-i18n-attr="aria-label:app.nextMonth">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="dp-weekdays" aria-hidden="true">
      <span class="sun" data-week="0"></span><span data-week="1"></span><span data-week="2"></span><span data-week="3"></span><span data-week="4"></span><span data-week="5"></span><span class="sat" data-week="6"></span>
    </div>
    <div id="dp-grid" class="dp-grid"></div>
    <div id="dp-years" class="dp-years" hidden></div>
    <div class="dp-foot">
      <button type="button" id="dp-today" class="pill" data-i18n="app.today"></button>
    </div>
  </div>
</dialog>

<!-- 물어보기 (지울까요? 같은 확인) -->
<dialog id="ask" class="ask-dialog" aria-labelledby="ask-text">
  <div class="ask">
    <p id="ask-text" class="ask-text"></p>
    <!-- 탈퇴처럼 되돌릴 수 없는 일에서만 비밀번호를 한 번 더 받습니다. 구글로 들어온 사람은 구글로 -->
    <input id="ask-password" class="ask-password" type="password" autocomplete="current-password" data-i18n-attr="placeholder:gate.password;aria-label:gate.password" hidden>
    <div id="ask-google" class="google-button" hidden></div>
    <div class="ask-foot">
      <button type="button" id="ask-no" class="btn btn-ghost" data-i18n="common.no"></button>
      <button type="button" id="ask-yes" class="btn btn-danger" data-i18n="common.yes"></button>
    </div>
  </div>
</dialog>

<!-- 비밀번호 바꾸기. form이라 엔터로 저장되고, 비밀번호 관리자가 새 비밀번호를 알아챕니다 -->
<dialog id="pw" class="ask-dialog" aria-labelledby="pw-title">
  <form id="pw-form" class="ask">
    <p id="pw-title" class="ask-text" data-i18n="settings.changePassword"></p>
    <input id="pw-current" class="ask-password" type="password" autocomplete="current-password" required data-i18n-attr="placeholder:settings.currentPassword;aria-label:settings.currentPassword">
    <input id="pw-new" class="ask-password" type="password" autocomplete="new-password" minlength="8" required data-i18n-attr="placeholder:gate.newPassword;aria-label:gate.newPassword">
    <div class="ask-foot">
      <button type="button" id="pw-cancel" class="btn btn-ghost" data-i18n="common.cancel"></button>
      <button type="submit" id="pw-save" class="btn btn-solid" data-i18n="common.save"></button>
    </div>
  </form>
</dialog>

<!-- popover라야 모달 창(top layer) 위로 올라옵니다 -->
<div id="install-banner" class="install-banner" hidden>
  <p id="install-banner-android" data-i18n="install.bannerAndroid"></p>
  <p id="install-banner-ios" data-i18n-html="install.bannerIos"></p>
  <button type="button" id="install-banner-go" class="btn btn-solid" data-i18n="install.bannerGo"></button>
  <button type="button" id="install-banner-close" class="install-banner-close" data-i18n-attr="aria-label:install.later">×</button>
</div>

<div id="toast"class="toast" role="status" aria-live="polite" popover="manual" hidden></div>
